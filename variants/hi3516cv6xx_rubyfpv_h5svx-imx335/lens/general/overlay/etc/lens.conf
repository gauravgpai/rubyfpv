# Zoom/focus lens module and telemetry port of the "lens" image variant.
# Reboot to apply.

# Lens module: Pelco-D on the camera's wired UART, as the stock firmware
# drives it (PTZProtocol=PelcoD, PTZBaudRate=57600, Address=1).
LENS_PORT=/dev/ttyAMA0
LENS_BAUD=57600
LENS_ADDR=1

# Autofocus: 1 = send the lens board the picture's sharpness (lensaf), so it
# focuses by itself, also after a zoom. 0 = manual focus only.
LENS_AF=1

# Flight-controller telemetry for Ruby comes in on UART2 (/dev/ttyAMA2).
# UART2_RX=alarm  RXD on the alarm input (GPIO1_5); "none" leaves the pad alone
# UART2_TX=none   Ruby cannot send requests to the FC (MAVLink streams work;
#                 MSP status and battery polling do not). "reset" puts TXD on
#                 the reset button pad (GPIO7_6).
UART2_RX=alarm
UART2_TX=none
