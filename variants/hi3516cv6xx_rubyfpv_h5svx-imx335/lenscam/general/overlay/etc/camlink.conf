# Second camera of the two-camera setup (lens camera, no radio).
# Reboot to apply.

# This camera's address on the Ethernet link, and the server camera's.
OWN_IP=192.168.1.11
SERVER_IP=192.168.1.10

# Zoom from the server's dial: 1 on, 0 off. ZOOM_TRAVEL_MS is the motor run
# time from fully out to fully in (measured at about 8 s on the H5SVX lens).
ZOOM=1
ZOOM_TRAVEL_MS=8000

# Video mode. OWN_MODE=0: resolution, frame rate and sensor profile follow the
# server camera. OWN_MODE=1: this camera uses MODE instead; codec, bitrate and
# keyframe interval still follow the server. The ground station's decoder
# restarts when the shown camera changes to one with another resolution.
#   MODE=1080p60 | 1080p90 | 864p120 | 720p120 | 972p60
OWN_MODE=0
MODE=1080p60
