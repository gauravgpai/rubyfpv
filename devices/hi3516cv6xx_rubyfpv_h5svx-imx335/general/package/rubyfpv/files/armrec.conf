# SD card recording while armed (/usr/sbin/armrec). Changes apply after a reboot.

# 1 = record while armed when an SD card is in, 0 = never record.
ENABLED=1

# Seconds to keep recording after the flight controller disarms.
STOP_DELAY=30

# Folder on the card. Files are <folder>/sNNNN_HHMMSS.mp4; NNNN counts power-ups.
FOLDER=fpv

# When the card is fuller than this (percent), the oldest clips are deleted.
MAX_USAGE=90

# How often the recorder flushes to the card, in seconds. On a power cut you
# lose at most this much of the last clip.
SYNC_SECONDS=5
