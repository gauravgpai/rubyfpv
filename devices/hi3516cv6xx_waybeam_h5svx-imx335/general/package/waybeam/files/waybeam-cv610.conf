# Platform settings for /etc/init.d/S95waybeam on Hi3516CV610 + IMX335
# (2-lane, MIPI PHY lanes 0 and 2).
WAYBEAM_ENABLED=1
CV610_SENSOR=imx335
# The MPP modules come from the firmware (S70vendor: load_hisilicon with the
# vendor open_pm, after S69svbfix); the 24 MHz sensor clock from S94imx335clk.
CV610_MODULES=firmware
CV610_AUDIO=0
